<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">DevStack CLI workflow preview</title>
  <desc id="desc">A terminal-inspired diagram showing the interactive menu, framework installer workflow, and application generator workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#15112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="690" rx="26" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="180" fill="#4f46e5" opacity=".08"/>
  <circle cx="80" cy="640" r="190" fill="#7c3aed" opacity=".08"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(54 38)">
      <rect width="46" height="46" rx="13" fill="url(#accent)"/>
      <path d="M23 8 39 17 23 26 7 17 23 8Zm-16 16 16 9 16-9v7l-16 9-16-9v-7Z" fill="#fff"/>
      <text x="62" y="20" fill="#fff" font-size="22" font-weight="700">DEVSTACK CLI</text>
      <text x="62" y="41" fill="#9ca3af" font-size="12" letter-spacing="2">DEVELOPER WORKFLOW</text>
    </g>
    <text x="54" y="130" fill="#fff" font-size="34" font-weight="750">From setup commands to a ready project.</text>
    <text x="54" y="162" fill="#a5b4fc" font-size="16">Choose a workflow. Configure your project. Start building.</text>

    <g transform="translate(54 205)" filter="url(#shadow)">
      <rect width="1092" height="126" rx="16" fill="#0b1220" stroke="#334155"/>
      <path d="M0 16a16 16 0 0 1 16-16h1060a16 16 0 0 1 16 16v24H0Z" fill="#1e293b"/>
      <circle cx="24" cy="20" r="5" fill="#fb7185"/><circle cx="44" cy="20" r="5" fill="#fbbf24"/><circle cx="64" cy="20" r="5" fill="#34d399"/>
      <text x="88" y="25" fill="#cbd5e1" font-size="12">Terminal — DevStack CLI</text>
      <text x="28" y="75" fill="#a78bfa" font-size="15" font-weight="700">$</text>
      <text x="50" y="75" fill="#f8fafc" font-size="16">npx --yes github:Bagaas-ind/DevStack-CLI</text>
      <text x="28" y="104" fill="#94a3b8" font-size="14">DEVSTACK CLI  ·  1. Framework Installer   2. Application Generator   3. Exit</text>
    </g>

    <g transform="translate(54 365)">
      <rect width="526" height="260" rx="18" fill="#111c2d" stroke="#475569"/>
      <rect width="526" height="7" rx="4" fill="#8b5cf6"/>
      <circle cx="34" cy="42" r="15" fill="#6d28d9"/>
      <text x="34" y="47" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">01</text>
      <text x="62" y="48" fill="#fff" font-size="21" font-weight="700">Framework Installer</text>
      <text x="28" y="87" fill="#c4b5fd" font-size="13" font-weight="700">SELECT A FRAMEWORK</text>
      <g font-size="14" fill="#e2e8f0">
        <text x="30" y="119">› Laravel</text><text x="30" y="145">› React / Vue / Next.js</text>
        <text x="30" y="171">› Express.js</text><text x="30" y="197">› Django / Flask / FastAPI</text>
        <text x="30" y="223">› Spring Boot · CodeIgniter · Symfony</text>
      </g>
      <path d="M355 95v145" stroke="#334155"/>
      <text x="378" y="119" fill="#94a3b8" font-size="12">THEN</text>
      <text x="378" y="147" fill="#f8fafc" font-size="14" font-weight="600">Project name</text>
      <text x="378" y="174" fill="#f8fafc" font-size="14" font-weight="600">Runtime check</text>
      <text x="378" y="201" fill="#f8fafc" font-size="14" font-weight="600">Install &amp; setup</text>
      <rect x="378" y="216" width="112" height="27" rx="7" fill="#14532d"/>
      <text x="434" y="234" fill="#86efac" font-size="12" text-anchor="middle" font-weight="700">SUCCESS</text>
    </g>

    <g transform="translate(620 365)">
      <rect width="526" height="260" rx="18" fill="#111c2d" stroke="#475569"/>
      <rect width="526" height="7" rx="4" fill="#3b82f6"/>
      <circle cx="34" cy="42" r="15" fill="#1d4ed8"/>
      <text x="34" y="47" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">02</text>
      <text x="62" y="48" fill="#fff" font-size="21" font-weight="700">Application Generator</text>
      <text x="28" y="87" fill="#93c5fd" font-size="13" font-weight="700">CONFIGURE YOUR STARTER</text>
      <rect x="28" y="105" width="210" height="112" rx="12" fill="#0b1220" stroke="#334155"/>
      <text x="45" y="132" fill="#f8fafc" font-size="15" font-weight="700">React frontend</text>
      <text x="45" y="157" fill="#94a3b8" font-size="13">JavaScript / TypeScript</text>
      <text x="45" y="184" fill="#60a5fa" font-size="13">Vite · Tailwind · Router</text>
      <rect x="258" y="105" width="240" height="112" rx="12" fill="#0b1220" stroke="#334155"/>
      <text x="276" y="132" fill="#f8fafc" font-size="15" font-weight="700">Laravel API</text>
      <text x="276" y="157" fill="#94a3b8" font-size="13">Sanctum · Auth · Roles</text>
      <text x="276" y="184" fill="#fb7185" font-size="13">SQLite / MySQL / PostgreSQL</text>
      <path d="M238 160h20" stroke="#64748b" stroke-width="2"/><path d="m251 154 7 6-7 6" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="28" y="245" fill="#94a3b8" font-size="13">Generate → install dependencies → run locally</text>
    </g>
    <text x="600" y="665" text-anchor="middle" fill="#64748b" font-size="12">Illustrative workflow · Actual prompts depend on the selected option and environment</text>
  </g>
</svg>