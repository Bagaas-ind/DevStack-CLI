<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">StackPilot workflow</title><desc id="desc">Runtime Doctor, Framework Installer, and Application Generator overview.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif">
<g transform="translate(56 42)"><rect width="54" height="54" rx="15" fill="url(#accent)"/><path d="m27 9 19 11-19 11L8 20 27 9Zm-19 19 19 11 19-11v8L27 48 8 36v-8Z" fill="#fff"/><text x="72" y="36" fill="#fff" font-size="28" font-weight="700">STACKPILOT</text></g>
<text x="56" y="160" fill="#fff" font-size="40" font-weight="750">One CLI. Every Development Environment.</text><text x="56" y="196" fill="#cbd5e1" font-size="18">Diagnose tools. Set up frameworks. Generate application starters.</text>
<rect x="56" y="242" width="1088" height="110" rx="18" fill="#020617" stroke="#334155"/><text x="82" y="314" fill="#7dd3fc" font-size="20" font-weight="700">$ stackpilot doctor</text><text x="380" y="314" fill="#cbd5e1" font-size="17">[OK] Node.js   [OK] npm   [OPTIONAL] PHP / Python / Java / Docker</text>
<g transform="translate(56 390)"><rect width="340" height="210" rx="18" fill="#111c2d" stroke="#475569"/><rect width="340" height="7" rx="4" fill="#38bdf8"/><text x="26" y="52" fill="#7dd3fc" font-size="15" font-weight="700">01 · RUNTIME DOCTOR</text><text x="26" y="98" fill="#fff" font-size="23" font-weight="700">Know your tools</text><text x="26" y="140" fill="#cbd5e1" font-size="15">Detect versions and PATH</text><text x="26" y="166" fill="#cbd5e1" font-size="15">without changing your system.</text></g>
<g transform="translate(430 390)"><rect width="340" height="210" rx="18" fill="#111c2d" stroke="#475569"/><rect width="340" height="7" rx="4" fill="#6366f1"/><text x="26" y="52" fill="#a5b4fc" font-size="15" font-weight="700">02 · FRAMEWORK INSTALLER</text><text x="26" y="98" fill="#fff" font-size="23" font-weight="700">Start clean</text><text x="26" y="140" fill="#cbd5e1" font-size="15">Guided framework setup</text><text x="26" y="166" fill="#cbd5e1" font-size="15">using native tools.</text></g>
<g transform="translate(804 390)"><rect width="340" height="210" rx="18" fill="#111c2d" stroke="#475569"/><rect width="340" height="7" rx="4" fill="#818cf8"/><text x="26" y="52" fill="#c7d2fe" font-size="15" font-weight="700">03 · APPLICATION GENERATOR</text><text x="26" y="98" fill="#fff" font-size="23" font-weight="700">Build faster</text><text x="26" y="140" fill="#cbd5e1" font-size="15">Laravel API + React SPA</text><text x="26" y="166" fill="#cbd5e1" font-size="15">with configurable starter options.</text></g>
<text x="600" y="650" text-anchor="middle" fill="#94a3b8" font-size="13">More modules are planned. Only implemented features are marked available.</text></g></svg>