name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    name: CLI checks (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate POSIX launcher syntax
        if: runner.os != 'Windows'
        run: bash -n templates/root/start.sh
      - name: Run tests
        run: npm test

  php-lint:
    name: PHP template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint backend templates
        run: find templates/backend -name '*.php' -print0 | xargs -0 -n1 php -l
