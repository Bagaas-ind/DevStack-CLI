name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    name: CLI checks (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate POSIX launcher syntax
        if: runner.os != 'Windows'
        run: bash -n templates/root/start.sh
      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Run tests
        run: npm test
      - name: Verify npm package contents
        run: npm pack --dry-run

  php-lint:
    name: PHP template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint backend templates
        run: find templates/backend -name '*.php' -print0 | xargs -0 -n1 php -l

  generated-project:
    name: Generate project, build frontend, and test Laravel API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, curl, fileinfo, openssl, tokenizer, xml
          coverage: none
      - name: Install CLI dependencies
        run: npm ci
      - name: Generate Laravel + React project
        run: node index.js ci-generated-app --database sqlite --laravel-version '12.*' --non-interactive --skip-install
      - name: Build generated React frontend
        working-directory: ci-generated-app/frontend
        run: |
          npm install
          npm audit --audit-level=moderate
          npm run build
      - name: Run generated Laravel feature tests
        working-directory: ci-generated-app/backend
        run: php artisan test
      - name: Generate TypeScript frontend
        run: node index.js ci-generated-ts --skip-backend --typescript --non-interactive --skip-install
      - name: Build and type-check generated TypeScript frontend
        working-directory: ci-generated-ts/frontend
        run: |
          npm install
          npm audit --audit-level=moderate
          npm run build
          npm run typecheck
